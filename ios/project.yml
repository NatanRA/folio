name: MediaPortal
options:
  bundleIdPrefix: com.natan
  deploymentTarget:
    iOS: '17.0'
packages:
  ZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    exactVersion: 3.0.1
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.8.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '0.9.7'
    CURRENT_PROJECT_VERSION: 20
targets:
  MediaPortal:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Folio
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # Without it, iPhones cap the app's own animations at 60 Hz even on 120 Hz screens.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.natan.mediaportal.navigation
            CFBundleURLSchemes: [folio]
          - CFBundleURLName: com.natan.mediaportal.pairing
            CFBundleURLSchemes: [folio-pair]
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.natan.cbz
            UTTypeDescription: CBZ comic archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
              public.mime-type: application/vnd.comicbook+zip
        CFBundleDocumentTypes:
          - CFBundleTypeName: Books and audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container, public.audio, com.adobe.pdf, com.natan.cbz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natan.mediaportal
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: Frameworks/TDLib.xcframework
        embed: true
      - package: ZIPFoundation
        product: ReadiumZIPFoundation
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
  MediaPortalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../app/src/androidTest/assets/alice.epub
        buildPhase: resources
      - path: ../app/src/androidTest/assets/chaptered.m4b
        buildPhase: resources
      - path: ../app/src/androidTest/assets/sample.pdf
        buildPhase: resources
      - path: ../app/src/androidTest/assets/comic.cbz
        buildPhase: resources
    dependencies:
      - target: MediaPortal
      - framework: Frameworks/TDLib.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MediaPortalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MediaPortal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MediaPortal:
    build:
      targets:
        MediaPortal: all
    test:
      targets: [MediaPortalTests, MediaPortalUITests]
